<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { background: transparent; }
  .panel {
    margin: 6px; padding: 14px; display: flex; gap: 10px; align-items: flex-start;
    background: var(--elevated); border: 0.5px solid var(--border-strong);
    border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25);
    -webkit-app-region: drag;
  }
  .icon { font-size: 20px; }
  h3 { font-size: 13.5px; margin-bottom: 3px; }
  p { font-size: 11.5px; color: var(--text2); line-height: 1.4; max-height: 48px; overflow: hidden; }
  .close { -webkit-app-region: no-drag; background: none; border: none; color: var(--text3); font-size: 15px; margin-left: auto; }
</style>
</head>
<body>
<div class="panel">
  <div class="icon">⚠️</div>
  <div style="flex:1;min-width:0">
    <h3>分析失败</h3>
    <p id="msg"></p>
  </div>
  <button class="close" onclick="gnw.send('error:dismiss')">✕</button>
</div>
<script>
  gnw.on('error:message', (m) => { document.getElementById('msg').textContent = m; });
</script>
</body>
</html>
