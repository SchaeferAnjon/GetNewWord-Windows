<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { background: transparent; height: 100%; }
  .panel {
    margin: 12px; height: calc(100% - 24px);
    display: flex; flex-direction: column;
    background: var(--elevated);
    border: 0.5px solid var(--border-strong); border-radius: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,.28);
    overflow: hidden;
  }

  /* 头部 */
  .header {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    border-bottom: 0.5px solid var(--border);
    -webkit-app-region: drag;
    cursor: move;
    user-select: none;
  }
  .header .titles { flex: 1; min-width: 0; }
  .header h2 { font-size: calc(14px * var(--fs)); display: flex; align-items: center; gap: 6px; }
  .header .sub { font-size: calc(11px * var(--fs)); color: var(--text2); margin-top: 2px; }
  .hbtn {
    background: none; border: none; color: var(--text3); font-size: 15px;
    padding: 4px 6px; border-radius: 6px;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }
  .hbtn:hover { background: var(--hover); color: var(--text); }
  .hbtn.active { color: var(--accent); }
  .undo-btn { font-size: calc(11.5px * var(--fs)); }

  /* 内容 */
  .content { flex: 1; overflow-y: auto; padding: 14px 20px; }
  .card { display: flex; flex-direction: column; gap: 16px; padding: 14px 2px; }
  .word-line { display: flex; align-items: baseline; gap: 12px; }
  .word-line .w { font-size: calc(28px * var(--fs)); font-weight: 700; user-select: text; }
  .word-line .ph { font-family: Consolas, Menlo, monospace; font-size: calc(14px * var(--fs)); color: var(--text2); }
  .chips { display: flex; align-items: center; gap: 6px; }
  .grammar { font-family: Consolas, Menlo, monospace; font-size: calc(13px * var(--fs)); font-weight: 600; color: var(--accent); }
  .dup-note { font-size: calc(11px * var(--fs)); color: var(--text2); }
  .sec { display: flex; flex-direction: column; gap: 6px; }
  .meaning { font-size: calc(15.5px * var(--fs)); line-height: 1.5; user-select: text; }
  .ctx-sentence { font-size: calc(14.5px * var(--fs)); font-style: italic; line-height: 1.5; user-select: text; }
  .ctx-tr { font-size: calc(12.5px * var(--fs)); color: var(--text2); margin-top: 3px; }
  .shot img { max-width: 100%; max-height: 180px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); display: block; }
  .example .ex-foreign { font-size: calc(13.5px * var(--fs)); line-height: 1.45; }
  .example .ex-zh { font-size: calc(12px * var(--fs)); color: var(--text2); margin-bottom: 5px; }
  .ety { font-size: calc(13px * var(--fs)); color: var(--text2); line-height: 1.55; }
  .enriching { display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--fs)); color: var(--text3); }

  /* 骨架 */
  .skeleton { animation: pulse 1.6s ease-in-out infinite; display: flex; flex-direction: column; gap: 14px; padding: 14px 2px; }
  .bar { background: var(--selected); border-radius: 4px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* 归入行 */
  .cat-row { display: flex; align-items: center; gap: 8px; font-size: calc(11.5px * var(--fs)); color: var(--text2); flex-wrap: wrap; }
  .suggest {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    background: rgba(205, 125, 20, 0.10); border-radius: var(--radius);
    font-size: calc(11.5px * var(--fs)); color: var(--text2);
  }
  .newgroup { display: flex; gap: 6px; align-items: center; }

  /* 片段卡 */
  .snip-title { font-size: calc(15px * var(--fs)); font-weight: 600; }
  .snip-content { font-size: calc(14.5px * var(--fs)); line-height: 1.55; white-space: pre-wrap; user-select: text; }
  .snip-src { font-size: calc(11.5px * var(--fs)); color: var(--text2); font-style: italic; }
  .snip-head { display: flex; align-items: center; gap: 8px; color: var(--text2); font-size: calc(13px * var(--fs)); font-weight: 600; margin-top: 4px; }

  .empty { text-align: center; padding: 44px 0; color: var(--text2); }
  .empty .big { font-size: 30px; opacity: .4; }

  /* 底部 */
  .bottom { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 0.5px solid var(--border); }
  .bottom .count { font-size: calc(11px * var(--fs)); color: var(--text2); flex: 1; }

  .checkbox { width: 17px; height: 17px; accent-color: var(--accent); }
  .trash-btn { background: none; border: none; color: var(--text3); font-size: 13px; margin-left: auto; padding: 3px 5px; border-radius: 5px; }
  .trash-btn:hover { color: var(--danger); background: var(--hover); }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div class="titles">
      <h2 id="h-title"></h2>
      <div class="sub" id="h-sub"></div>
    </div>
    <button class="hbtn undo-btn" id="undo" style="display:none">↩ 撤销</button>
    <button class="hbtn" id="mainwin" title="打开主窗口">🗔</button>
    <button class="hbtn" id="imgsearch" title="找图：看看这是什么东西">🖼</button>
    <button class="hbtn" id="pin" title="钉在桌面上">📌</button>
    <button class="hbtn" id="close" title="关闭">✕</button>
  </div>
  <div class="content" id="content"></div>
  <div class="bottom">
    <span class="count" id="count"></span>
    <span id="actions"></span>
  </div>
</div>

<script src="common.js"></script>
<script>
let S = null;
let pinned = false;

function setPinnedState(value) {
  pinned = Boolean(value);
  const b = document.getElementById('pin');
  b.classList.toggle('active', pinned);
  b.setAttribute('aria-pressed', String(pinned));
  b.textContent = pinned ? '📍' : '📌';
  b.title = pinned ? '已钉住：点面板外不会关闭（Esc 或 ✕ 可关闭）' : '钉在桌面上';
}

gnw.on('panel:state', (state) => { S = state; render(); });
gnw.on('play-audio', async (msg) => {
  if (msg.path) { const url = await gnw.invoke('file:url', msg.path); if (url) { playAudioURL(url); return; } }
  if (msg.tts) speakTTS(msg.tts.text, msg.tts.language);
});
gnw.on('settings-changed', (s) => document.documentElement.style.setProperty('--fs', s.fontScale || 1));
gnw.on('panel:setPin', setPinnedState);
gnw.invoke('db:all').then(d => document.documentElement.style.setProperty('--fs', d.settings.fontScale || 1));

window.addEventListener('keydown', (e) => { if (e.key === 'Escape') gnw.send('panel:dismiss'); });   // Esc 永远可关（钉住只防点外面误关）
document.getElementById('close').addEventListener('click', () => gnw.send('panel:dismiss'));
document.getElementById('mainwin').addEventListener('click', () => gnw.send('window:showMain'));
document.getElementById('imgsearch').addEventListener('click', () => {
  const first = S?.result?.words?.[0];
  const word = first?.word || S?.quickWord?.word;
  if (!word) return;
  // 多义词消歧：搜「词 + 当前语境义项」（如 "bulb 球茎"）
  const sense = (first?.contextMeaning || '').trim();
  const query = sense ? `${word} ${sense}` : word;
  gnw.send('open-external', `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query)}`);
});
document.getElementById('undo').addEventListener('click', () => gnw.send('panel:undo'));
document.getElementById('pin').addEventListener('click', async function () {
  this.disabled = true;
  try {
    const confirmed = await gnw.invoke('panel:setPinned', !pinned);
    setPinnedState(confirmed);
  } finally {
    this.disabled = false;
  }
});

function render() {
  if (!S) return;
  renderHeader();
  renderContent();
  renderBottom();
}

function renderHeader() {
  const t = document.getElementById('h-title');
  const sub = document.getElementById('h-sub');
  if (!S.result) {
    t.innerHTML = `<span class="spinner"></span> 识别中`;
    sub.textContent = S.cachedHit ? '词库直出 · 正在核对语境…' : (S.quickWord ? '释义生成中…' : '正在识别选区…');
  } else if (S.autoSaved) {
    const wc = liveWords().length, sc = liveSnippets().length;
    t.innerHTML = `<span style="color:var(--ok)">✓</span> 已保存`;
    sub.textContent = `${wc} 个单词${sc ? `、${sc} 条知识片段` : ''} 已入库，Anki 稍后自动同步`;
  } else {
    t.innerHTML = `🔍 快速查词`;
    sub.textContent = '仅查看，不入库；需要留下就点「保存」';
  }
  document.getElementById('undo').style.display = S.autoSaved ? '' : 'none';
}

const liveWords = () => (S.result?.words || []).map((w, i) => [w, i]).filter(([, i]) => !S.removedWords.includes(i));
const liveSnippets = () => (S.result?.snippets || []).map((s, i) => [s, i]).filter(([, i]) => !S.removedSnippets.includes(i));

function renderContent() {
  const el = document.getElementById('content');
  let html = '';

  if (!S.result) {
    html = S.cachedHit ? cachedCardHTML(S.cachedHit) : skeletonHTML();
  } else {
    for (const [w, i] of liveWords()) html += wordCardHTML(w, i);
    const snips = liveSnippets();
    if (snips.length) {
      if (liveWords().length) html += `<hr class="hairline">`;
      html += `<div class="snip-head">📖 知识片段</div>`;
      for (const [s, i] of snips) html += snippetCardHTML(s, i);
    }
    if (!liveWords().length && !snips.length) {
      html = `<div class="empty"><div class="big">🔍</div><div style="margin-top:8px">未识别到单词或知识片段</div></div>`;
    }
  }
  el.innerHTML = html;
  bindContentEvents(el);
}

// 词库直出卡：快速识词命中已存词条，秒出完整内容
function cachedCardHTML(w) {
  const e = S.enrichments[0] || {};
  let h = `<div class="card"><div>
    <div class="word-line"><span class="w">${esc(w.word)}</span>
      ${w.phonetic ? `<span class="ph">/${esc(w.phonetic)}/</span>` : ''}
      <button class="hbtn speak-cached" title="朗读">🔊</button></div>
    <div class="chips" style="margin-top:8px">${diffChip(w.difficulty)}<span class="chip sans">${esc(langName(w.language))}</span>
      ${w.lookupCount > 1 ? `<span class="chip accent">×${w.lookupCount}</span>` : ''}</div>
    ${w.grammar ? `<div class="grammar" style="margin-top:6px">${esc(w.grammar)}</div>` : ''}
    <div class="dup-note" style="margin-top:6px">⚡ 词库里已有这个词，直接展示；正在核对本次语境是否新增</div>
  </div><hr class="hairline">`;
  h += `<div class="sec"><div class="section-label">释义</div><div class="meaning">${emphasizeMeaningHTML(w.contextMeaning, w.meaning)}</div></div>`;
  if (w.contextSentence) {
    h += `<div class="sec"><div class="section-label">语境</div><div class="quote-block">
      <div class="ctx-sentence">${hlHTML(w.word, w.contextSentence)}</div>
      ${w.contextTranslation ? `<div class="ctx-tr">${emphasizeTranslationHTML(w.translationKeyword, w.contextMeaning, w.contextTranslation)}</div>` : ''}
    </div></div>`;
  }
  if (e.usage) h += `<div class="sec"><div class="section-label">用法</div><div class="usage-box">${esc(e.usage)}</div></div>`;
  if (e.collocations?.length) h += `<div class="sec"><div class="section-label">搭配</div>${e.collocations.map(c => exampleHTML(c, w.word)).join('')}</div>`;
  if (e.examples?.length) h += `<div class="sec"><div class="section-label">例句</div>${e.examples.map(x => exampleHTML(x, w.word)).join('')}</div>`;
  if (e.etymology) h += `<div class="sec"><div class="section-label">词根词源</div><div class="ety">${esc(e.etymology)}</div></div>`;
  h += `</div>`;
  return h;
}

function skeletonHTML() {
  const head = S.quickWord
    ? `<div class="word-line"><span class="w">${esc(S.quickWord.word)}</span><span class="chip sans">${esc((S.quickWord.language || '').toUpperCase())}</span></div>`
    : `<div class="bar" style="width:180px;height:26px"></div>`;
  return `<div class="skeleton">${head}<hr class="hairline">
    <div class="bar" style="width:260px;height:14px"></div>
    <div class="bar" style="width:420px;height:12px"></div>
    <div class="bar" style="width:360px;height:12px"></div>
    <div class="bar" style="width:300px;height:12px"></div></div>`;
}

function wordCardHTML(w, i) {
  const e = S.enrichments[i] || {};
  const usage = e.usage || w.analysisNote;
  const colls = e.collocations;
  const examples = e.examples || w.examples;
  const ety = e.etymology || w.etymology;
  const enriching = S.enrichingIndices.includes(i);

  let h = `<div class="card" data-idx="${i}">`;
  // 词头
  h += `<div>
    <div class="word-line">
      ${!S.autoSaved && S.mode === 'lookup' ? `<input type="checkbox" class="checkbox sel" data-i="${i}" ${S.selectedIndices.includes(i) ? 'checked' : ''}>` : ''}
      <span class="w">${esc(w.word)}</span>
      ${w.phonetic ? `<span class="ph">/${esc(w.phonetic)}/</span>` : ''}
      <button class="hbtn speak-word" data-i="${i}" title="朗读">🔊</button>
    </div>
    <div class="chips" style="margin-top:8px">
      ${diffChip(w.difficulty)}
      <span class="chip sans">${esc(langName(w.language))}</span>
      ${(S.lookupCounts?.[i] || 0) > 1 ? `<span class="chip accent">×${S.lookupCounts[i]}</span>` : ''}
      ${S.autoSaved ? `<button class="trash-btn rm-word" data-i="${i}" title="单项移除：只把这个词从本次保存中撤掉">🗑</button>` : ''}
    </div>
    ${w.grammar ? `<div class="grammar" style="margin-top:6px">${esc(w.grammar)}</div>` : ''}
    ${S.skippedAsDuplicate.includes(i) ? `<div class="dup-note" style="margin-top:6px">ⓘ 这个词已在词库里，且语境几乎相同，本次未重复添加</div>` : ''}
  </div>
  <hr class="hairline">`;

  h += `<div class="sec"><div class="section-label">释义</div><div class="meaning">${emphasizeMeaningHTML(w.contextMeaning, w.meaning)}</div></div>`;

  if (w.contextSentence) {
    h += `<div class="sec"><div class="section-label">语境</div>
      <div class="quote-block">
        <div class="ctx-sentence">${hlHTML(w.word, w.contextSentence)}</div>
        ${w.contextTranslation ? `<div class="ctx-tr">${emphasizeTranslationHTML(w.translationKeyword, w.contextMeaning, w.contextTranslation)}</div>` : ''}
      </div></div>`;
  }

  if (S.screenshotDataURL) {
    h += `<div class="sec shot"><div class="section-label">截图</div><img src="${S.screenshotDataURL}"></div>`;
  }

  if (usage) h += `<div class="sec"><div class="section-label">用法</div><div class="usage-box">${esc(usage)}</div></div>`;

  if (!S.enrichments[i] && !(colls && colls.length) && !(examples && examples.length)) {
    h += `<div class="enriching"><span class="spinner"></span> 用法 · 例句 · 词根词源 生成中…</div>`;
  }

  if (colls?.length) h += `<div class="sec"><div class="section-label">搭配</div>${colls.map(c => exampleHTML(c, w.word)).join('')}</div>`;
  if (examples?.length) h += `<div class="sec"><div class="section-label">例句</div>${examples.map(x => exampleHTML(x, w.word)).join('')}</div>`;
  if (ety) h += `<div class="sec"><div class="section-label">词根词源</div><div class="ety">${esc(ety)}</div></div>`;

  h += categoryRowHTML(true, i, w.suggestedCategory);
  h += `</div>`;
  return h;
}

function snippetCardHTML(s, i) {
  return `<div class="card" data-sidx="${i}">
    <div style="display:flex;align-items:center">
      <span class="snip-title">${esc(s.title)}</span>
      ${S.autoSaved ? `<button class="trash-btn rm-snip" data-i="${i}" title="从这次保存中移除">🗑</button>` : ''}
    </div>
    <div class="snip-content">${esc(s.content)}</div>
    ${s.sourceContext ? `<div class="snip-src">${esc(s.sourceContext)}</div>` : ''}
    ${S.screenshotDataURL ? `<div class="sec shot"><img src="${S.screenshotDataURL}"></div>` : ''}
    ${categoryRowHTML(false, i, s.suggestedCategory)}
  </div>`;
}

function categoryRowHTML(forWords, i, suggested) {
  const chosen = forWords ? S.chosenWordCategory[i] : S.chosenSnippetCategory[i];
  const options = forWords ? S.categories.forWords : S.categories.forSnippets;
  let h = `<div class="cat-row">📁 归入
    <select class="gnw cat-sel" data-fw="${forWords ? 1 : 0}" data-i="${i}">
      <option value="">未选择</option>
      ${options.map(c => `<option value="${c.id}" ${chosen === c.id ? 'selected' : ''}>${esc(c.parentName)} › ${esc(c.name)}</option>`).join('')}
      <option value="__new__">＋ 新建分组…</option>
    </select>
    <span class="newgroup" style="display:none">
      <input class="gnw newgroup-name" placeholder="${forWords ? '如：法语' : '如：交通规则'}" style="width:110px">
      <button class="btn small primary newgroup-ok">创建并归入</button>
    </span>
  </div>`;
  if (!chosen && suggested) {
    h += `<div class="suggest">✨ 体系里没有合适的分类，AI 建议新建「${esc(suggested)}」
      <button class="btn small primary sug-create" data-fw="${forWords ? 1 : 0}" data-i="${i}" data-name="${esc(suggested)}" style="margin-left:auto">新建并移入</button></div>`;
  } else if (!chosen) {
    h += `<div class="dup-note">AI 未能归类，请从上方选择；不选则按${forWords ? '语言' : '「其他」'}自动归入</div>`;
  }
  return h;
}

function bindContentEvents(el) {
  el.querySelectorAll('.speak-cached').forEach(b => b.addEventListener('click', () => {
    if (S.cachedHit) speakWord(S.cachedHit.word, S.cachedHit.language);
  }));
  el.querySelectorAll('.speak-word').forEach(b => b.addEventListener('click', () => {
    const w = S.result?.words?.[+b.dataset.i];
    if (w) speakWord(w.word, w.language);
  }));
  el.querySelectorAll('.rm-word').forEach(b => b.addEventListener('click', () => gnw.send('panel:removeWord', +b.dataset.i)));
  el.querySelectorAll('.rm-snip').forEach(b => b.addEventListener('click', () => gnw.send('panel:removeSnippet', +b.dataset.i)));
  el.querySelectorAll('.sel').forEach(c => c.addEventListener('change', () => gnw.send('panel:toggleSelection', +c.dataset.i)));
  el.querySelectorAll('.cat-sel').forEach(sel => sel.addEventListener('change', () => {
    const forWords = sel.dataset.fw === '1', i = +sel.dataset.i;
    if (sel.value === '__new__') {
      sel.parentElement.querySelector('.newgroup').style.display = '';
      sel.parentElement.querySelector('.newgroup-name').focus();
      return;
    }
    gnw.send('panel:setCategory', forWords, i, sel.value || null);
  }));
  el.querySelectorAll('.newgroup-ok').forEach(b => b.addEventListener('click', async () => {
    const row = b.closest('.cat-row');
    const sel = row.querySelector('.cat-sel');
    const name = row.querySelector('.newgroup-name').value.trim();
    if (!name) return;
    await gnw.invoke('panel:createCategory', sel.dataset.fw === '1', +sel.dataset.i, name);
  }));
  el.querySelectorAll('.sug-create').forEach(b => b.addEventListener('click', async () => {
    await gnw.invoke('panel:createCategory', b.dataset.fw === '1', +b.dataset.i, b.dataset.name);
  }));
  // 点词头朗读
  el.querySelectorAll('.card .w').forEach(w => w.addEventListener('dblclick', () => {
    const idx = +w.closest('.card').dataset.idx;
    const word = S.result?.words?.[idx];
    if (word) speakWord(word.word, word.language);
  }));
}

function renderBottom() {
  const count = document.getElementById('count');
  const actions = document.getElementById('actions');
  const total = (S.result?.words || []).length;
  if (S.autoSaved) {
    count.textContent = '';
    actions.innerHTML = `<button class="btn primary" id="done">完成</button>`;
    document.getElementById('done').addEventListener('click', () => gnw.send('panel:dismiss'));
  } else if (S.result) {
    count.textContent = `已选择 ${S.selectedIndices.length}/${total}`;
    actions.innerHTML = `<button class="btn" id="cls">关闭</button> <button class="btn primary" id="save" ${S.selectedIndices.length || liveSnippets().length ? '' : 'disabled'}>保存选中</button>`;
    document.getElementById('cls').addEventListener('click', () => gnw.send('panel:dismiss'));
    document.getElementById('save').addEventListener('click', () => gnw.send('panel:save'));
  } else {
    count.textContent = '';
    actions.innerHTML = '';
  }
}

gnw.send('panel:requestState');
</script>
</body>
</html>
