<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { width: 52px; height: 52px; -webkit-app-region: drag; display: flex; align-items: center; justify-content: center; }
  #btn {
    -webkit-app-region: no-drag;
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(94, 106, 210, 0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease, background .12s ease;
  }
  #btn:hover { transform: scale(1.08); background: rgba(94, 106, 210, 1); }
  svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
</style>
</head>
<body>
<button id="btn" title="截图取词（右键更多）">
  <svg viewBox="0 0 24 24">
    <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/>
    <circle cx="12" cy="12" r="3.2"/>
  </svg>
</button>
<script>
  document.getElementById('btn').addEventListener('click', () => gnw.send('float:capture'));
  window.addEventListener('contextmenu', (e) => { e.preventDefault(); gnw.send('float:menu'); });
</script>
</body>
</html>
