<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GetNewWord</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  .app { display: flex; height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .sidebar { width: 218px; min-width: 218px; background: var(--surface); display: flex; flex-direction: column; border-right: 0.5px solid var(--border); }
  .nav { padding: 10px 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .nav-row, .cat-row {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius);
    color: var(--text2); cursor: pointer; font-size: calc(13px * var(--fs));
  }
  .nav-row:hover, .cat-row:hover { background: var(--hover); }
  .nav-row.sel, .cat-row.sel { background: var(--selected); color: var(--text); font-weight: 600; }
  .nav-row .kbd { margin-left: auto; }
  .cat-tree { flex: 1; overflow-y: auto; padding: 0 8px; }
  .cat-tree .section-label { padding: 12px 8px 6px; }
  .cat-row { font-size: calc(12.5px * var(--fs)); padding: 5px 8px; }
  .cat-row .count { margin-left: auto; font-family: Consolas, Menlo, monospace; font-size: calc(10px * var(--fs)); color: var(--text3); }
  .cat-row.child { padding-left: 22px; }
  .group-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 0.5px solid var(--border); font-size: calc(11px * var(--fs)); color: var(--text3); }
  .group-row select { margin-left: auto; }

  /* ---------- 中栏列表 ---------- */
  .list-col { width: 390px; min-width: 340px; display: flex; flex-direction: column; border-right: 0.5px solid var(--border); background: var(--bg); }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 0.5px solid var(--border); -webkit-app-region: no-drag; }
  .toolbar .title { font-size: calc(14px * var(--fs)); font-weight: 700; margin-right: auto; padding-left: 4px; }
  .toolbar input { flex: 0 1 170px; }
  .list { flex: 1; overflow-y: auto; position: relative; padding: 6px 8px; }
  .row { position: relative; padding: 6px 10px; border-radius: var(--radius); cursor: default; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 6px; right: 6px; height: 0.5px; background: var(--border); }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--selected); }
  .row.sel::after { content: ""; position: absolute; left: 1px; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: rgba(94,106,210,.7); }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; }
  .row .w { font-size: calc(14px * var(--fs)); font-weight: 600; }
  .row .ph { font-family: Consolas, Menlo, monospace; font-size: calc(11px * var(--fs)); color: var(--text3); }
  .row .l1 .right { margin-left: auto; display: flex; gap: 5px; align-items: center; }
  .row .gram { font-family: Consolas, Menlo, monospace; font-size: calc(10.5px * var(--fs)); color: var(--accent); }
  .row .l2 { display: flex; gap: 8px; margin-top: 2px; }
  .row .meaning { font-size: calc(12px * var(--fs)); color: var(--text2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .lang { margin-left: auto; font-family: Consolas, Menlo, monospace; font-size: calc(10px * var(--fs)); color: var(--text3); }
  .row .sync-ok { color: var(--ok); font-size: calc(10px * var(--fs)); }
  .row .sync-fail { color: var(--danger); font-size: calc(10px * var(--fs)); }
  .marquee { position: absolute; background: rgba(94,106,210,.10); border: 1px solid rgba(94,106,210,.5); pointer-events: none; z-index: 5; }
  .empty-list { text-align: center; padding-top: 70px; color: var(--text2); }
  .empty-list .big { font-size: 32px; opacity: .35; }
  .group-header { padding: 12px 8px 4px; }

  /* ---------- 右栏详情 ---------- */
  .detail-col { flex: 1; overflow-y: auto; background: var(--bg); }
  .detail { max-width: 720px; padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; }
  .d-word { font-size: calc(30px * var(--fs)); font-weight: 700; user-select: text; }
  .d-ph { font-family: Consolas, Menlo, monospace; font-size: calc(14px * var(--fs)); color: var(--text2); user-select: text; }
  .d-gram { font-family: Consolas, Menlo, monospace; font-size: calc(13px * var(--fs)); font-weight: 600; color: var(--accent); margin-top: 6px; user-select: text; }
  .d-actions { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .d-meaning { font-size: calc(15px * var(--fs)); line-height: 1.55; user-select: text; }
  .d-ctx { font-size: calc(14px * var(--fs)); line-height: 1.5; user-select: text; }
  .d-ctx-tr { font-size: calc(12.5px * var(--fs)); color: var(--text2); margin-top: 3px; user-select: text; }
  .d-ctx-meta { font-family: Consolas, Menlo, monospace; font-size: calc(10px * var(--fs)); color: var(--text3); margin-top: 4px; }
  .d-extra { font-size: calc(13.5px * var(--fs)); line-height: 1.5; user-select: text; }
  .d-ety { font-size: calc(13px * var(--fs)); color: var(--text2); line-height: 1.55; user-select: text; }
  .d-shot img { max-width: 480px; width: 100%; border-radius: var(--radius); border: 0.5px solid var(--border-strong); }
  .meta-row { display: flex; gap: 12px; font-size: calc(12px * var(--fs)); color: var(--text2); }
  .meta-row .k { font-family: Consolas, Menlo, monospace; font-size: calc(10px * var(--fs)); color: var(--text3); width: 40px; }
  .placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text2); gap: 10px; }
  .placeholder .big { font-size: 36px; opacity: .3; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .edit-field { width: 100%; }
  textarea.gnw { background: var(--elevated); border: .5px solid var(--border-strong); border-radius: var(--radius); padding: 6px 8px; font-size: calc(13px * var(--fs)); resize: vertical; min-height: 52px; outline: none; }
  textarea.gnw:focus { border-color: var(--accent); }

  /* 统计 */
  .stats { padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; max-width: 780px; }
  .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-card { padding: 16px; border-radius: 12px; }
  .stat-card .v { font-size: calc(24px * var(--fs)); font-weight: 700; margin: 6px 0 2px; }
  .stat-card .t { font-size: calc(11px * var(--fs)); color: var(--text2); }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: calc(11.5px * var(--fs)); }
  .bar-row .lab { width: 56px; font-weight: 600; }
  .bar-track { flex: 1; height: 15px; background: var(--hover); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-row .n { width: 32px; text-align: right; color: var(--text2); }

  /* ---------- 弹窗 ---------- */
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--elevated); border: .5px solid var(--border-strong); border-radius: 12px; box-shadow: 0 18px 60px rgba(0,0,0,.3); min-width: 340px; max-width: 560px; max-height: 84vh; display: flex; flex-direction: column; }
  .modal h3 { padding: 14px 18px 0; font-size: calc(14.5px * var(--fs)); }
  .modal .m-body { padding: 12px 18px; overflow-y: auto; font-size: calc(12.5px * var(--fs)); color: var(--text2); display: flex; flex-direction: column; gap: 10px; }
  .modal .m-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 14px; }

  /* 设置 */
  .settings-tabs { display: flex; gap: 2px; padding: 10px 18px 0; border-bottom: .5px solid var(--border); }
  .settings-tabs button { background: none; border: none; padding: 7px 12px; color: var(--text2); font-size: calc(12.5px * var(--fs)); border-bottom: 2px solid transparent; }
  .settings-tabs button.sel { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
  .set-row { display: flex; align-items: center; gap: 10px; }
  .set-row .grow { flex: 1; }
  .set-note { font-size: calc(11px * var(--fs)); color: var(--text3); }
  .seg { display: inline-flex; border: .5px solid var(--border-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button { background: none; border: none; padding: 4px 12px; font-size: calc(11.5px * var(--fs)); color: var(--text2); }
  .seg button.sel { background: var(--selected); color: var(--text); font-weight: 600; }
  .hotkey-box { min-width: 150px; text-align: center; padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-family: Consolas, Menlo, monospace; font-size: calc(12px * var(--fs)); cursor: pointer; }
  .hotkey-box.rec { border-color: var(--accent); color: var(--accent); }
  .anki-stat { display: flex; gap: 22px; }
  .anki-stat .item { text-align: center; }
  .anki-stat .v { font-size: calc(19px * var(--fs)); font-weight: 600; }
  .anki-stat .t { font-size: calc(10.5px * var(--fs)); color: var(--text2); }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="nav" id="nav"></div>
    <hr class="hairline" style="margin:0 12px">
    <div class="cat-tree" id="catTree"></div>
    <div class="group-row">分组
      <select class="gnw" id="groupMode">
        <option value="all">全部</option>
        <option value="byDay">按天</option>
        <option value="byDifficulty">按难度</option>
        <option value="byDomain">领域</option>
      </select>
    </div>
  </div>

  <div class="list-col">
    <div class="toolbar">
      <span class="title" id="colTitle">单词</span>
      <input class="gnw" id="search" placeholder="搜索单词、释义、语境...">
      <button class="icon-btn" id="btnCapture" title="截图取词">📷</button>
      <button class="icon-btn" id="btnSync" title="同步 Anki（Ctrl+Shift+S）">🔄</button>
      <button class="icon-btn" id="btnMore" title="导入 / 导出">⋯</button>
      <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="detail-col" id="detailCol"></div>
</div>

<div id="modalHost"></div>

<script src="common.js"></script>
<script src="main-window.js"></script>
</body>
</html>
