<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
// 框选覆盖层：全屏截图 + 半透明遮罩 + 选区清晰显示；
// mouseup 后按 macOS 版逻辑裁剪：选区四周扩展一圈作语境 + 红框标出圈选区域

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let img = null;          // 全分辨率截图
let start = null, cur = null;

gnw.on('overlay:init', ({ imageDataURL }) => {
  img = new Image();
  img.onload = () => {
    resize();
    draw();
    // The native window starts hidden to avoid flashing its black background.
    // Reveal it only after this canvas contains the captured screen.
    gnw.send('overlay:ready');
  };
  img.src = imageDataURL;
});

function resize() {
  cv.width = window.innerWidth * devicePixelRatio;
  cv.height = window.innerHeight * devicePixelRatio;
}

function draw() {
  if (!img) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, cv.width, cv.height);

  if (start && cur) {
    const r = rectPx();
    // 选区内重绘清晰原图
    const sx = r.x / cv.width * img.naturalWidth;
    const sy = r.y / cv.height * img.naturalHeight;
    const sw = r.w / cv.width * img.naturalWidth;
    const sh = r.h / cv.height * img.naturalHeight;
    if (sw > 1 && sh > 1) {
      ctx.drawImage(img, sx, sy, sw, sh, r.x, r.y, r.w, r.h);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5 * devicePixelRatio;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      // 尺寸提示
      const label = `${Math.round(r.w / devicePixelRatio)} × ${Math.round(r.h / devicePixelRatio)}`;
      ctx.font = `${11 * devicePixelRatio}px Consolas, monospace`;
      const tw = ctx.measureText(label).width;
      const tx = r.x + (r.w - tw) / 2, ty = r.y - 8 * devicePixelRatio;
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(tx - 4 * devicePixelRatio, ty - 12 * devicePixelRatio, tw + 8 * devicePixelRatio, 16 * devicePixelRatio);
      ctx.fillStyle = '#fff';
      ctx.fillText(label, tx, ty);
    }
  }
}

function rectPx() {
  const dpr = devicePixelRatio;
  const x1 = Math.min(start.x, cur.x) * dpr, y1 = Math.min(start.y, cur.y) * dpr;
  const x2 = Math.max(start.x, cur.x) * dpr, y2 = Math.max(start.y, cur.y) * dpr;
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

window.addEventListener('mousedown', (e) => {
  if (e.button === 2) { gnw.send('overlay:cancel'); return; }
  start = { x: e.clientX, y: e.clientY };
  cur = { ...start };
  draw();
});
window.addEventListener('mousemove', (e) => {
  if (!start) return;
  cur = { x: e.clientX, y: e.clientY };
  draw();
});
window.addEventListener('mouseup', () => {
  if (!start || !cur || !img) return;
  const r = rectPx();
  if (r.w / devicePixelRatio < 6 || r.h / devicePixelRatio < 6) { gnw.send('overlay:cancel'); return; }
  finish(r);
});
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') gnw.send('overlay:cancel'); });

function finish(r) {
  // 画布坐标 → 原图像素坐标
  const kx = img.naturalWidth / cv.width, ky = img.naturalHeight / cv.height;
  const sel = { x: r.x * kx, y: r.y * ky, w: r.w * kx, h: r.h * ky };

  // 选区四周扩展作语境：选区越小扩得越多（单词 → 整句/整段）；CSS 像素换算到图片像素
  const cssW = r.w / devicePixelRatio, cssH = r.h / devicePixelRatio;
  const small = cssW < 400 || cssH < 120;
  const padX = (small ? 520 : 40) * devicePixelRatio * kx;
  const padY = (small ? 120 : 30) * devicePixelRatio * ky;
  const cx = Math.max(0, sel.x - padX);
  const cy = Math.max(0, sel.y - padY);
  const cw = Math.min(img.naturalWidth, sel.x + sel.w + padX) - cx;
  const ch = Math.min(img.naturalHeight, sel.y + sel.h + padY) - cy;

  // 语境图 + 红框
  const out = document.createElement('canvas');
  out.width = Math.round(cw); out.height = Math.round(ch);
  const octx = out.getContext('2d');
  octx.drawImage(img, cx, cy, cw, ch, 0, 0, out.width, out.height);
  const inset = 3 * devicePixelRatio * kx;
  octx.strokeStyle = 'rgba(255,26,26,1)';
  octx.lineWidth = Math.max(2, 2 * kx * devicePixelRatio);
  octx.strokeRect(sel.x - cx - inset, sel.y - cy - inset, sel.w + inset * 2, sel.h + inset * 2);

  const scaled = (maxDim, quality) => {
    const k = Math.min(1, maxDim / Math.max(out.width, out.height));
    if (k >= 1) return out.toDataURL('image/jpeg', quality);
    const c = document.createElement('canvas');
    c.width = Math.round(out.width * k); c.height = Math.round(out.height * k);
    c.getContext('2d').drawImage(out, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', quality);
  };

  gnw.send('overlay:done', {
    pngDataURL: out.toDataURL('image/png'),
    apiDataURL: scaled(1200, 0.8),
    quickDataURL: scaled(1000, 0.75),
    width: out.width, height: out.height
  });
}
</script>
</body>
</html>
